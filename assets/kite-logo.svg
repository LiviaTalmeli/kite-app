<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="facetTopLeft" x1="60" y1="10" x2="20" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="facetTopRight" x1="60" y1="10" x2="100" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="facetBottomLeft" x1="60" y1="130" x2="20" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="facetBottomRight" x1="60" y1="130" x2="100" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#EEF2FF" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Top Left Facet -->
  <polygon points="60,12 24,65 60,65" fill="url(#facetTopLeft)" />
  
  <!-- Top Right Facet (Brighter) -->
  <polygon points="60,12 96,65 60,65" fill="url(#facetTopRight)" />
  
  <!-- Bottom Left Facet -->
  <polygon points="60,65 24,65 60,128" fill="url(#facetBottomLeft)" />
  
  <!-- Bottom Right Facet -->
  <polygon points="60,65 96,65 60,128" fill="url(#facetBottomRight)" />

  <!-- Inner Structural Spine Lines for Origami/Kite Feel -->
  <line x1="60" y1="12" x2="60" y2="128" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
  <line x1="24" y1="65" x2="96" y2="65" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
  
  <!-- Outer Outline Accent -->
  <polygon points="60,12 96,65 60,128 24,65" fill="none" stroke="rgba(255, 255, 255, 0.9)" stroke-width="2" stroke-linejoin="round" />
</svg>
